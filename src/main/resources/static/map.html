<!DOCTYPE html>
<html>
<head>
    <title>RainScape Map - Routes</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        .legend {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 18px;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        .legend div {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }
        .legend span {
            display: inline-block;
            width: 20px;
            height: 3px;
            margin-right: 8px;
        }
        .legend .green { background: green; opacity: 0.7; }
        .legend .yellow { background: yellow; opacity: 0.7; }
        .legend .red { background: red; opacity: 0.7; }
    </style>
</head>
<body>
<div id="map"></div>
<div class="legend">
    <div><span class="green"></span> Clear Route</div>
    <div><span class="yellow"></span> Moderately Affected</div>
    <div><span class="red"></span> Waterlogged Route</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script>
    // ✅ Initialize Map
    var map = L.map('map').setView([28.4595, 77.0266], 13); // Gurgaon center

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // ✅ Origin & Destination
    var origin = L.latLng(28.4595, 77.0266); // Gurgaon central
    var destination = L.latLng(28.4744, 77.0410); // Nearby destination

    // ✅ Clear Route (Green)
    L.Routing.control({
        waypoints: [origin, destination],
        lineOptions: { styles: [{color: 'green', weight: 5, opacity: 0.7}] },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: false,
        createMarker: () => null
    }).addTo(map);

    // ✅ Moderately Affected Route (Yellow)
    L.Routing.control({
        waypoints: [
            origin,
            L.latLng(28.4650, 77.0320), // moderate diversion point
            destination
        ],
        lineOptions: { styles: [{color: 'yellow', weight: 5, opacity: 0.7, dashArray: '4, 6'}] },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: false,
        createMarker: () => null
    }).addTo(map);

    // ✅ Waterlogged Route (Red)
    L.Routing.control({
        waypoints: [
            origin,
            L.latLng(28.4690, 77.0360), // heavy diversion point
            destination
        ],
        lineOptions: { styles: [{color: 'red', weight: 5, opacity: 0.7, dashArray: '6, 6'}] },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: false,
        createMarker: () => null
    }).addTo(map);

</script>
</body>
</html>
